name: Push to Buf Schema Registry

on:
  push:
    branches:
      - main
    paths:
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.lock'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Push to Buf Schema Registry
        run: buf push
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
